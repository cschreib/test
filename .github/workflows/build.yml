name: cmake

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Ubuntu GCC,             os: ubuntu-latest,  build: ubuntu}
        - { name: Windows 64,             os: windows-latest, build: windows}

    name: ${{matrix.platform.name}}
    runs-on: ${{matrix.platform.os}}

    steps:
    - name: Build
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
        mkdir install
        echo 'Some file from ${{matrix.platform.name}}' > install/build.txt

    - name: Upload build as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-${{matrix.platform.build}}
        path: ${{github.workspace}}/install

